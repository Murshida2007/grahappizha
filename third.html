<!DOCTYPE html>
<html lang="ml">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>ഗ്രഹപ്പിഴ.com | ഷിബു സ്വാമി ജ്യോതിഷം</title>

    <link rel="stylesheet" href="third.css">

</head>


<body>


    <!-- =====================================================
         AUDIO
         NO LOOP
         When audio ends → four.html
    ====================================================== -->

    <audio
        id="swamiAudio"
        preload="auto"
        playsinline
    >

        <source
            src="audio/swami.mpeg"
            type="audio/mpeg"
        >

        നിങ്ങളുടെ ബ്രൗസർ ഓഡിയോ പിന്തുണയ്ക്കുന്നില്ല.

    </audio>



    <!-- =====================================================
         MAIN ASTROLOGY BACKGROUND
    ====================================================== -->

    <div class="astrology-bg">


        <!-- =================================================
             EXTRA BACKGROUND GLOW
        ================================================== -->

        <div class="background-glow"></div>

        <div class="center-glow"></div>


        <!-- =================================================
             GOLDEN CENTER GLOW
        ================================================== -->

        <div class="golden-glow"></div>


        <!-- =================================================
             MOVING LIGHT RAYS
        ================================================== -->

        <div class="light-rays"></div>


        <!-- =================================================
             ZODIAC RING
        ================================================== -->

        <div class="zodiac">


            <div class="zodiac-inner"></div>


            <span class="symbol s1">♈</span>

            <span class="symbol s2">♉</span>

            <span class="symbol s3">♊</span>

            <span class="symbol s4">♋</span>

            <span class="symbol s5">♌</span>

            <span class="symbol s6">♍</span>

            <span class="symbol s7">♎</span>

            <span class="symbol s8">♏</span>

            <span class="symbol s9">♐</span>

            <span class="symbol s10">♑</span>

            <span class="symbol s11">♒</span>

            <span class="symbol s12">♓</span>


        </div>



        <!-- =================================================
             TOP DECORATION
        ================================================== -->

        <div class="top-decoration">

            <span>✦</span>

            <span>✧</span>

            <span>✦</span>

        </div>



        <!-- =================================================
             LEFT HANGING LAMP
        ================================================== -->

        <div class="lamp lamp-left">

            <div class="chain"></div>

            <div class="lamp-top"></div>

            <div class="lamp-body">

                <span class="flame"></span>

                <span class="flame"></span>

                <span class="flame"></span>

            </div>

        </div>



        <!-- =================================================
             RIGHT HANGING LAMP
        ================================================== -->

        <div class="lamp lamp-right">

            <div class="chain"></div>

            <div class="lamp-top"></div>

            <div class="lamp-body">

                <span class="flame"></span>

                <span class="flame"></span>

                <span class="flame"></span>

            </div>

        </div>



        <!-- =================================================
             PARTICLES
        ================================================== -->

        <div class="particles">

            <span class="particle p1"></span>
            <span class="particle p2"></span>
            <span class="particle p3"></span>
            <span class="particle p4"></span>
            <span class="particle p5"></span>
            <span class="particle p6"></span>
            <span class="particle p7"></span>
            <span class="particle p8"></span>
            <span class="particle p9"></span>
            <span class="particle p10"></span>
            <span class="particle p11"></span>
            <span class="particle p12"></span>
            <span class="particle p13"></span>
            <span class="particle p14"></span>
            <span class="particle p15"></span>
            <span class="particle p16"></span>
            <span class="particle p17"></span>
            <span class="particle p18"></span>
            <span class="particle p19"></span>
            <span class="particle p20"></span>

        </div>



        <!-- =================================================
             MAIN CONTENT
        ================================================== -->

        <main class="main-content">


            <!-- =================================================
                 WEBSITE LOGO
            ================================================== -->

            <div class="site-logo">

                <img
                    src="logo1.png"
                    alt="ഗ്രഹപ്പിഴ.com"
                >

            </div>



            <!-- =================================================
                 SWAMI STAGE
            ================================================== -->

            <section class="swami-stage">


                <!-- AURA -->

                <div class="swami-aura"></div>


                <!-- GROUND GLOW -->

                <div class="ground-glow"></div>


                <!-- REFLECTION -->

                <img
                    src="swa.png"
                    class="swami-reflection"
                    alt=""
                    aria-hidden="true"
                >


                <!-- MAIN SWAMI -->

                <img
                    src="swa.png"
                    class="swami-image"
                    alt="ഷിബു സ്വാമി"
                >


            </section>



            <!-- =================================================
                 BOTTOM DECORATION
            ================================================== -->

            <div class="bottom-decoration">

                <span>✦</span>

                <span>ॐ</span>

                <span>✦</span>

            </div>


        </main>



        <!-- =================================================
             BOTTOM SMALL LAMPS
        ================================================== -->

        <div class="bottom-lamps">


            <div class="small-lamp small-lamp-left">

                <div class="small-flame"></div>

            </div>


            <div class="small-lamp small-lamp-right">

                <div class="small-flame"></div>

            </div>


        </div>


    </div>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="third.js"></script>


</body>

</html>
