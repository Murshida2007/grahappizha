<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ഷിബു സ്വാമി ജ്യോതിഷം | ജാതകം സമർപ്പിക്കുക</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@500;700;800&family=Noto+Sans+Malayalam:wght@500;700;800&family=Poppins:wght@600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="first.css">
    <link rel="stylesheet" href="second.css">
</head>

<body>

<div class="page">

    <!-- Top-left site logo -->
    <div class="site-logo">
        <img src="logo1.png" alt="ഗ്രഹപ്പിഴ.com">
    </div>


    <div class="pillar left"></div>
    <div class="pillar right"></div>


    <!-- LEFT DIYA -->
    <div class="diya left">

        <div class="chain"></div>

        <svg class="lamp" viewBox="0 0 64 40">
            <path d="M14 6 H50 L44 20 H20 Z"
                  fill="#caa23a"/>

            <ellipse cx="32"
                     cy="20"
                     rx="24"
                     ry="6"
                     fill="#e8c458"/>

            <rect x="30"
                  y="0"
                  width="4"
                  height="8"
                  fill="#b8892a"/>
        </svg>

        <div class="flame"></div>

    </div>


    <!-- RIGHT DIYA -->
    <div class="diya right">

        <div class="chain"></div>

        <svg class="lamp" viewBox="0 0 64 40">
            <path d="M14 6 H50 L44 20 H20 Z"
                  fill="#caa23a"/>

            <ellipse cx="32"
                     cy="20"
                     rx="24"
                     ry="6"
                     fill="#e8c458"/>

            <rect x="30"
                  y="0"
                  width="4"
                  height="8"
                  fill="#b8892a"/>
        </svg>

        <div class="flame"></div>

    </div>


    <!-- SWAMI IMAGE -->
    <div class="hero hero-sm">

        <div class="zodiac-glow"></div>

        <img class="swami-photo"
             src="swami.jpg"
             alt="ഷിബു സ്വാമി">

    </div>


    <!-- SWAMI HEADING -->
    <div class="talk-heading">

        <p class="mal talk-line">

            <svg class="flourish" viewBox="0 0 30 20">

                <path d="M2 16 L14 4
                         M14 4 L9 4
                         M14 4 L14 9"
                      fill="none"
                      stroke="var(--gold)"
                      stroke-width="2.2"
                      stroke-linecap="round"
                      stroke-linejoin="round"/>

            </svg>

            ആഹാ.... വന്നിരിക്കുന്നത് ഒരു മഹാനുഭാവനാണല്ലോ!

            <svg class="flourish flip" viewBox="0 0 30 20">

                <path d="M2 16 L14 4
                         M14 4 L9 4
                         M14 4 L14 9"
                      fill="none"
                      stroke="var(--gold)"
                      stroke-width="2.2"
                      stroke-linecap="round"
                      stroke-linejoin="round"/>

            </svg>

        </p>


        <p class="mal talk-line">

            <svg class="flourish" viewBox="0 0 30 20">

                <path d="M2 16 L14 4
                         M14 4 L9 4
                         M14 4 L14 9"
                      fill="none"
                      stroke="var(--gold)"
                      stroke-width="2.2"
                      stroke-linecap="round"
                      stroke-linejoin="round"/>

            </svg>

            ഇരിക്ക്... നിന്റെ ജാതകത്തിലെ ദോഷങ്ങൾ ഞാൻ തപ്പിയെടുക്കാം.

            <svg class="flourish flip" viewBox="0 0 30 20">

                <path d="M2 16 L14 4
                         M14 4 L9 4
                         M14 4 L14 9"
                      fill="none"
                      stroke="var(--gold)"
                      stroke-width="2.2"
                      stroke-linecap="round"
                      stroke-linejoin="round"/>

            </svg>

        </p>

    </div>


    <!-- ============================= -->
    <!-- JATHAKAM FORM -->
    <!-- ============================= -->

    <form class="jathaka-form" id="jathakaForm">

        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>


        <!-- ============================= -->
        <!-- 1. FULL NAME -->
        <!-- ============================= -->

        <div class="field">

            <label class="mal">

                <svg class="ficon" viewBox="0 0 24 24">

                    <circle cx="12"
                            cy="8"
                            r="4"
                            fill="var(--gold)"/>

                    <path d="M4 20
                             C4 14.5 7.6 12 12 12
                             C16.4 12 20 14.5 20 20 Z"
                          fill="var(--gold)"/>

                </svg>

                പേര് (Full Name)

            </label>


            <input type="text"
                   id="f-name"
                   class="mal"
                   placeholder="വീട്ടുകാർ പ്രാകുന്ന പേര്...">

        </div>


        <!-- ============================= -->
        <!-- 2. NAKSHATRAM -->
        <!-- ============================= -->

        <div class="field">

            <label class="mal">

                <svg class="ficon" viewBox="0 0 24 24">

                    <path d="M12 2
                             L14.5 9.5
                             L22 12
                             L14.5 14.5
                             L12 22
                             L9.5 14.5
                             L2 12
                             L9.5 9.5 Z"
                          fill="var(--gold)"/>

                </svg>

                നക്ഷത്രം (Nakshatram)

            </label>


            <div class="input-icon-wrap select-wrap">

                <select id="f-nakshatram"
                        name="nakshatram"
                        class="mal">

                    <option value=""
                            disabled
                            selected>
                        നക്ഷത്രം തിരഞ്ഞെടുക്കുക...
                    </option>

                    <option value="ashwini">
                        അശ്വതി (Ashwini)
                    </option>

                    <option value="bharani">
                        ഭരണി (Bharani)
                    </option>

                    <option value="karthika">
                        കാർത്തിക (Karthika / Krittika)
                    </option>

                    <option value="rohini">
                        രോഹിണി (Rohini)
                    </option>

                    <option value="makeeryam">
                        മകയിരം (Makeeryam / Mrigashirsha)
                    </option>

                    <option value="thiruvaathira">
                        തിരുവാതിര (Thiruvaathira / Ardra)
                    </option>

                    <option value="punartham">
                        പുണർതം (Punartham / Punarvasu)
                    </option>

                    <option value="pooyyam">
                        പൂയം (Pooyyam / Pushya)
                    </option>

                    <option value="aayilyam">
                        ആയില്യം (Aayilyam / Ashlesha)
                    </option>

                    <option value="makam">
                        മകം (Makam / Magha)
                    </option>

                </select>

            </div>

        </div>


        <!-- ============================= -->
        <!-- 3. DATE OF BIRTH -->
        <!-- ============================= -->

        <div class="field">

            <label class="mal">

                <svg class="ficon" viewBox="0 0 24 24">

                    <rect x="3.5"
                          y="5"
                          width="17"
                          height="15"
                          rx="2.2"
                          fill="none"
                          stroke="var(--gold)"
                          stroke-width="1.8"/>

                    <path d="M3.5 9.5 H20.5"
                          stroke="var(--gold)"
                          stroke-width="1.8"/>

                    <path d="M7.5 3 V6.5
                             M16.5 3 V6.5"
                          stroke="var(--gold)"
                          stroke-width="1.8"
                          stroke-linecap="round"/>

                    <circle cx="8.2"
                            cy="13.5"
                            r="1.2"
                            fill="var(--gold)"/>

                </svg>

                ജനന തിയതി (DOB)

            </label>


            <div class="input-icon-wrap">

                <input type="date"
                       id="f-dob">


                <svg class="input-icon"
                     viewBox="0 0 24 24">

                    <rect x="3.5"
                          y="5"
                          width="17"
                          height="15"
                          rx="2.2"
                          fill="none"
                          stroke="var(--gold)"
                          stroke-width="1.8"/>

                    <path d="M3.5 9.5 H20.5"
                          stroke="var(--gold)"
                          stroke-width="1.8"/>

                    <path d="M7.5 3 V6.5
                             M16.5 3 V6.5"
                          stroke="var(--gold)"
                          stroke-width="1.8"
                          stroke-linecap="round"/>

                </svg>

            </div>

        </div>


        <!-- ============================= -->
        <!-- 4. BIRTH TIME -->
        <!-- ============================= -->

        <div class="field">

            <label class="mal">

                <svg class="ficon" viewBox="0 0 24 24">

                    <circle cx="12"
                            cy="12"
                            r="8.5"
                            fill="none"
                            stroke="var(--gold)"
                            stroke-width="1.8"/>

                    <path d="M12 7 V12 L15.5 14"
                          fill="none"
                          stroke="var(--gold)"
                          stroke-width="1.8"
                          stroke-linecap="round"
                          stroke-linejoin="round"/>

                </svg>

                ജനിച്ച സമയം (Birth Time)

            </label>


            <div class="input-icon-wrap select-wrap">

                <select id="f-birthtime"
                        name="birthtime"
                        class="mal">

                    <option value=""
                            disabled
                            selected>
                        ജനിച്ച സമയം തിരഞ്ഞെടുക്കുക...
                    </option>

                    <option value="serial">
                        ഏഷ്യാനെറ്റിൽ സീരിയൽ തുടങ്ങുന്ന നേരം
                    </option>

                    <option value="kozhi">
                        അയൽവക്കത്തെ പൂവൻകോഴി കൂവിയ സമയം
                    </option>

                    <option value="pinnale">
                        പട്ടി നിർത്താതെ കുരച്ച ആ രാത്രിയിൽ
                    </option>

                    <option value="parippu">
                        കുക്കറിന്റെ മൂന്നാമത്തെ വിസിൽ കേട്ടപ്പോൾ
                    </option>

                    <option value="lunch">
                        ഉച്ചയ്ക്ക് ചോറുണ്ടിട്ട് ഒരു മയക്കം പിടിച്ച സമയം
                    </option>

                    <option value="dontknow">
                        കൃത്യം സമയം എനിക്ക് ഓർമ്മയില്ല സ്വാമീ
                    </option>

                </select>

            </div>

        </div>


        <!-- ============================= -->
        <!-- 5. CURRENT CRISIS -->
        <!-- ============================= -->

        <div class="field">

            <label for="crisis-select"
                   class="mal">

                <svg class="ficon"
                     viewBox="0 0 24 24">

                    <path d="M12 3
                             C8 3 5.5 5.6 5.5 9
                             C5.5 11.3 6.8 12.6 7.8 13.9
                             C8.4 14.7 8.8 15.4 8.9 16.5
                             H15.1
                             C15.2 15.4 15.6 14.7 16.2 13.9
                             C17.2 12.6 18.5 11.3 18.5 9
                             C18.5 5.6 16 3 12 3 Z"
                          fill="none"
                          stroke="var(--gold)"
                          stroke-width="1.8"
                          stroke-linejoin="round"/>

                    <path d="M9 19.5 H15
                             M9.7 21.5 H14.3"
                          stroke="var(--gold)"
                          stroke-width="1.8"
                          stroke-linecap="round"/>

                    <path d="M4 3.5 L2 2
                             M20 3.5 L22 2
                             M2.5 9 H0.5
                             M23.5 9 H21.5"
                          stroke="var(--gold)"
                          stroke-width="1.4"
                          stroke-linecap="round"/>

                </svg>

                നിലവിലെ പ്രതിസന്ധി (Current Crisis)

            </label>


            <div class="input-icon-wrap select-wrap">

                <select id="crisis-select"
                        name="crisis"
                        class="mal">

                    <option value=""
                            disabled
                            selected>
                        ഏറ്റവും വലിയ തലവേദന തിരഞ്ഞെടുക്കുക...
                    </option>

                    <option value="career">
                        പരീക്ഷ / കരിയർ പേടി
                    </option>

                    <option value="love">
                        പ്രണയം / തേപ്പ്
                    </option>

                    <option value="money">
                        കയ്യിൽ പൈസയില്ല (ദാരിദ്ര്യം)
                    </option>

                    <option value="laziness">
                        തീരാത്ത മടി
                    </option>

                    <option value="overthinking">
                        ഓവർതിങ്കിംഗ് / ഉറക്കമില്ലായ്മ
                    </option>

                    <option value="family">
                        വീട്ടുകാരുടെ ചോദ്യങ്ങളും പ്രാക്കും
                    </option>

                    <option value="screen">
                        ഫോൺ പ്രാന്ത് (റീൽസ് അഡിക്ഷൻ)
                    </option>

                    <option value="antisocial">
                        സോഷ്യൽ ബാറ്ററി തീർന്നു
                    </option>

                    <option value="directionless">
                        ഒരു വഴിയും കാണുന്നില്ല (Directionless)
                    </option>

                    <option value="marriage">
                        കല്യാണ പ്രഷർ
                    </option>

                    <option value="all">
                        എല്ലാമുണ്ട് സ്വാമീ, ഒന്നും പറയണ്ട
                    </option>

                </select>

            </div>

        </div>

    </form>


    <!-- ============================= -->
    <!-- CAMERA SECTION -->
    <!-- ============================= -->

    <div class="camera-section">

        <button type="button"
                id="startCamera"
                class="camera-btn">

            📷 Live Camera

        </button>


        <div id="cameraBox"
             class="camera-box">

            <video id="camera"
                   autoplay
                   playsinline>
            </video>

        </div>


        <button type="button"
                id="capturePhoto"
                class="camera-btn capture-btn">

            📸 Capture Photo

        </button>


        <canvas id="photoCanvas"></canvas>


        <img id="photoPreview"
             class="photo-preview"
             alt="Captured image">

    </div>


    <!-- ============================= -->
    <!-- BOTTOM DECORATION -->
    <!-- ============================= -->

    <div class="bottom-deco">

        <svg class="deco-swoosh"
             viewBox="0 0 30 20">

            <path d="M28 16 L16 4
                     M16 4 L21 4
                     M16 4 L16 9"
                  fill="none"
                  stroke="var(--gold)"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"/>

        </svg>


        <span class="deco-line"></span>


        <svg class="kalasham-sm"
             viewBox="0 0 80 90">

            <ellipse cx="40"
                     cy="80"
                     rx="26"
                     ry="7"
                     fill="#000"
                     opacity="0.3"/>

            <path d="M18 40
                     Q14 70 40 76
                     Q66 70 62 40
                     Q66 30 40 28
                     Q14 30 18 40 Z"
                  fill="#d9a441"/>

            <ellipse cx="40"
                     cy="40"
                     rx="24"
                     ry="8"
                     fill="#eec565"/>

            <rect x="34"
                  y="14"
                  width="12"
                  height="18"
                  rx="3"
                  fill="#d9a441"/>

            <ellipse cx="40"
                     cy="14"
                     rx="10"
                     ry="5"
                     fill="#eec565"/>

            <path d="M20 8
                     Q40 -6 60 8
                     Q40 4 20 8 Z"
                  fill="#3a7d3a"/>

        </svg>


        <span class="deco-line"></span>


        <svg class="deco-swoosh flip"
             viewBox="0 0 30 20">

            <path d="M28 16 L16 4
                     M16 4 L21 4
                     M16 4 L16 9"
                  fill="none"
                  stroke="var(--gold)"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"/>

        </svg>

    </div>


    <!-- SUBMIT BUTTON -->

    <button onclick="submitForm()"
            class="cta"
            id="ctaBtn2"
            form="jathakaForm"
            type="submit">

        <span class="mark">🔱</span>
        കവടി നിരത്തുക →

    </button>


</div>


<script src="first.js"></script>
<script src="second.js"></script>

</body>
</html>
